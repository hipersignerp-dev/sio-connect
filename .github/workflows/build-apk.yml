name: Build Android APK

# Every push to main (that touches the app) builds the APK and publishes it as a GitHub release
# tagged build-<number>, marked latest. The app's "Check for updates" (More) reads that release,
# downloads the APK and opens Android's installer. Updates install over the app only when every
# build is signed with the same key: add the ANDROID_KEYSTORE_* repository secrets (see README).

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_BASE64_2: ${{ secrets.ANDROID_KEYSTORE_BASE64_2 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release signing key (from secrets)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          # the key file can be pasted in two parts (phones cut long text): ANDROID_KEYSTORE_BASE64 + _2
          printf %s "$KEYSTORE_BASE64$KEYSTORE_BASE64_2" | tr -d '[:space:]' | base64 -d > android/app/release.jks
          # trim stray spaces/newlines from pasted secrets; the key password is the same as the store password
          SP="$(printf %s "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          KA="$(printf %s "$KEY_ALIAS" | tr -d '[:space:]')"; KA="${KA:-sio-connect}"
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$SP" "$KA" "$SP" > android/key.properties
          echo "key check: pw_len=${#SP} pw_sha=$(printf %s "$SP" | sha256sum | cut -c1-12) alias=$(printf %s "$KA" | sha256sum | cut -c1-12) jks_sha=$(sha256sum android/app/release.jks | cut -c1-12) b64_len=$((${#KEYSTORE_BASE64}+${#KEYSTORE_BASE64_2}))"
          if ! keytool -list -keystore android/app/release.jks -storepass "$SP" -alias "$KA" > /dev/null 2>&1; then
            echo "::warning::Release key could not be opened with the ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets; building with the default key instead."
            rm -f android/key.properties android/app/release.jks
          fi
      - name: Version
        id: version
        run: |
          BUILD=$((100 + ${{ github.run_number }}))
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=BUILD_NUMBER=${{ steps.version.outputs.build }} \
            --dart-define=UPDATE_REPO=${{ github.repository }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SIO-Connect.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SIO-Connect-apk
          path: mobile/build/app/outputs/flutter-apk/SIO-Connect.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.build }}
          target_commitish: ${{ github.sha }}
          name: SIO Connect (build ${{ steps.version.outputs.build }})
          body: ${{ steps.version.outputs.notes }}
          make_latest: true
          files: mobile/build/app/outputs/flutter-apk/SIO-Connect.apk
