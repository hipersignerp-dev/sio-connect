[project]
name = "sio_connect"
authors = [
    { name = "Hipersign", email = "hipersignerp@gmail.com" }
]
description = "SIO Connect: student organisation management (members, meetings, events, collections, expenses, notices) for Hipersign ERP, with a phone app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
exclude = ["mobile"]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
